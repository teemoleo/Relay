LoginRequest:
  type: object
  properties:
    username:
      type: string
    password:
      type: string
  required:
    - username
    - password

LoginResponse:
  type: object
  properties:
    user_id:
      type: integer
    name:
      type: string
    role:
      type: string
  required:
    - user_id
    - name
    - role
